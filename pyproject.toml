[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yt-whisper"
version = "2.0.0"
description = "Transcribe local audio and YouTube videos with Whisper"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["openai-whisper==20250625", "yt-dlp[default]>=2026.8.19,<2027"]

[project.optional-dependencies]
ui = ["gradio>=6.27,<7"]
thai = ["transformers>=5.17,<6", "safetensors>=0.6"]
dev = ["pytest>=8,<10", "build>=1,<2", "psutil>=7,<8"]

[project.scripts]
yt_whisper = "yt_whisper.cli:main"
yt_whisper_ui = "yt_whisper.ui:main"
yt_whisper_tool = "yt_whisper.tool:main"

[tool.setuptools.packages.find]
include = ["yt_whisper*"]
exclude = ["build*", "tests*", "audit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
